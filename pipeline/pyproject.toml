[project]
name = "movies"
version = "0.1.0"
description = "Data pipeline for the PV251 movie visualization project"
requires-python = ">=3.12"
dependencies = [
    "polars",
    "httpx",
    "rapidfuzz",
]

[project.scripts]
movies = "movies.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/movies"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
